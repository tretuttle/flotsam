name: Check

on:
  pull_request:
    types: [opened, synchronize, reopened, labeled, unlabeled]
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: check-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  check:
    name: Check
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0

      - name: Fetch main for agent context budget
        if: github.event_name != 'push' || github.ref != 'refs/heads/main'
        run: git fetch --quiet --no-tags --depth=1 origin +refs/heads/main:refs/remotes/origin/main

      - name: Pin main ref on push
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: git update-ref refs/remotes/origin/main HEAD

      - name: Setup Vite+
        uses: voidzero-dev/setup-vp@250f29ce396baf5e8f24498e17c0dfdebabc26eb # v1.15.0
        with:
          node-version: "26"
          cache: true
          run-install: true

      - name: Check
        run: vp run check
