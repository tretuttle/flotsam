name: Browser

on:
  pull_request:
    types: [opened, synchronize, reopened]
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: browser-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  # Immutable Zen release asset pinned by tag + SHA-256 (Milestone 160.0).
  ZEN_VERSION: "1.24.2b"
  ZEN_BUILD_ID: "20261111122308"
  ZEN_TAG: "1.24.2b"
  ZEN_SHA256: "bcf7e43160ecfe5f29953ed2a984e7a8028a58f2ec0e3114d36bb904d5f5ce80"

jobs:
  browser:
    name: Browser
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0

      - name: Setup Vite+
        uses: voidzero-dev/setup-vp@250f29ce396baf5e8f24498e17c0dfdebabc26eb # v1.15.0
        with:
          node-version: "26"
          cache: true
          run-install: true

      - name: Cache Zen Browser
        id: cache-zen
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/zen-browser
          key: zen-linux-x64-${{ env.ZEN_VERSION }}-${{ env.ZEN_BUILD_ID }}-${{ env.ZEN_SHA256 }}

      - name: Download and verify Zen Browser
        if: steps.cache-zen.outputs.cache-hit != 'true'
        run: |
          mkdir -p "${{ runner.temp }}/zen-browser"
          URL="https://github.com/zen-browser/desktop/releases/download/${ZEN_TAG}/zen.linux-x86_64.tar.xz"
          if ! curl -fsSL -o "${{ runner.temp }}/zen.tar.xz" "$URL"; then
            echo "::error::Pinned Zen release asset is unavailable at $URL. Update ZEN_VERSION, ZEN_BUILD_ID, ZEN_TAG, and ZEN_SHA256 in .github/workflows/browser.yml."
            exit 1
          fi
          if ! echo "${ZEN_SHA256}  ${{ runner.temp }}/zen.tar.xz" | sha256sum -c -; then
            echo "::error::Checksum mismatch for $URL (expected ${ZEN_SHA256}). Update ZEN_VERSION, ZEN_BUILD_ID, ZEN_TAG, and ZEN_SHA256 in .github/workflows/browser.yml."
            exit 1
          fi
          tar -xf "${{ runner.temp }}/zen.tar.xz" -C "${{ runner.temp }}/zen-browser"
          printf '%s\n' "${ZEN_SHA256}" > "${{ runner.temp }}/zen-browser/.verified-sha256"
          rm -f "${{ runner.temp }}/zen.tar.xz"

      - name: Verify cached Zen Browser
        run: |
          grep -qx "${ZEN_SHA256}" "${{ runner.temp }}/zen-browser/.verified-sha256"
          grep -qx "Version=${ZEN_VERSION}" "${{ runner.temp }}/zen-browser/zen/application.ini"
          grep -qx "BuildID=${ZEN_BUILD_ID}" "${{ runner.temp }}/zen-browser/zen/application.ini"

      # The *.namespace.test.ts suites need an unprivileged PID and user namespace and fail under CI
      # without one. This runner's AppArmor default refuses it (write failed /proc/self/uid_map).
      - name: Allow unprivileged user namespaces
        run: sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0

      - name: Pack extension
        run: vp run @one-click-har/extension#pack

      - name: Run discovered browser checks
        env:
          GECKO_BINARY: ${{ runner.temp }}/zen-browser/zen/zen
        run: |
          XPI=$(echo apps/extension/dist/one-click-har-*.xpi)
          node tools/browser-harness/src/cli.ts check --binary "$GECKO_BINARY" --extension "$XPI" --short --out-dir browser-results

      - name: Upload browser check results
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: browser-check-results
          path: browser-results/
          if-no-files-found: warn

  real-signal-suites:
    name: Real-signal suites
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0

      - name: Setup Vite+
        uses: voidzero-dev/setup-vp@250f29ce396baf5e8f24498e17c0dfdebabc26eb # v1.15.0
        with:
          node-version: "26"
          cache: true
          run-install: true

      - name: Cache Zen Browser
        id: cache-zen
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/zen-browser
          key: zen-linux-x64-${{ env.ZEN_VERSION }}-${{ env.ZEN_BUILD_ID }}-${{ env.ZEN_SHA256 }}

      - name: Download and verify Zen Browser
        if: steps.cache-zen.outputs.cache-hit != 'true'
        run: |
          mkdir -p "${{ runner.temp }}/zen-browser"
          URL="https://github.com/zen-browser/desktop/releases/download/${ZEN_TAG}/zen.linux-x86_64.tar.xz"
          if ! curl -fsSL -o "${{ runner.temp }}/zen.tar.xz" "$URL"; then
            echo "::error::Pinned Zen release asset is unavailable at $URL. Update ZEN_VERSION, ZEN_BUILD_ID, ZEN_TAG, and ZEN_SHA256 in .github/workflows/browser.yml."
            exit 1
          fi
          if ! echo "${ZEN_SHA256}  ${{ runner.temp }}/zen.tar.xz" | sha256sum -c -; then
            echo "::error::Checksum mismatch for $URL (expected ${ZEN_SHA256}). Update ZEN_VERSION, ZEN_BUILD_ID, ZEN_TAG, and ZEN_SHA256 in .github/workflows/browser.yml."
            exit 1
          fi
          tar -xf "${{ runner.temp }}/zen.tar.xz" -C "${{ runner.temp }}/zen-browser"
          printf '%s\n' "${ZEN_SHA256}" > "${{ runner.temp }}/zen-browser/.verified-sha256"
          rm -f "${{ runner.temp }}/zen.tar.xz"

      - name: Verify cached Zen Browser
        run: |
          grep -qx "${ZEN_SHA256}" "${{ runner.temp }}/zen-browser/.verified-sha256"
          grep -qx "Version=${ZEN_VERSION}" "${{ runner.temp }}/zen-browser/zen/application.ini"
          grep -qx "BuildID=${ZEN_BUILD_ID}" "${{ runner.temp }}/zen-browser/zen/application.ini"

      # The *.namespace.test.ts suites need an unprivileged PID and user namespace and fail under CI
      # without one. This runner's AppArmor default refuses it (write failed /proc/self/uid_map).
      - name: Allow unprivileged user namespaces
        run: sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0

      - name: Pack extension
        run: vp run @one-click-har/extension#pack

      - name: Run real-signal suites against the pinned browser
        working-directory: tools/browser-harness
        env:
          BROWSER_HARNESS_BINARY: ${{ runner.temp }}/zen-browser/zen/zen
        run: vp test run --config ../../vite.config.ts --dir . src/namespace-suites.test.ts
